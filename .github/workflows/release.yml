name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release-artifacts:
    name: Release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --workspace --release --bins

      - name: Stage distributable tree
        run: python3 x.py dist --release

      - name: Generate changelog
        run: python3 x.py changelog

      - name: Build versioned docs site
        run: python3 x.py docs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moira-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  determinism-gate:
    name: Stage-2 determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --workspace --release --bins
      - name: Run cross-process determinism check
        run: python3 x.py determinism --release

  publish:
    name: Publish GitHub release
    needs: [release-artifacts, determinism-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
