name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly `rustc` compatibility / divergence scan (Phase 3).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Test
        run: cargo test --workspace --verbose

  # Phase-1 speedup tracking: compile the benchmark battery with both Moira and
  # rustc and print the measured compile-time ratio.
  benchmark:
    name: Phase-1 speedup benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace
      - name: Run benchmark harness
        run: cargo run -p moira-bench --quiet

  # Phase 3 compatibility suite: run the curated Phase-1-subset slice through
  # Moira's acceptance tests, then scan the slice with `moira --diff` against
  # `rustc` and publish the divergence report. Divergences are tracked (not
  # fatal) so a nightly regression shows up as a report delta rather than a hard
  # red build.
  compatibility:
    name: Phase-1 compatibility slice (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace
      - name: Run Phase-1 slice acceptance tests
        run: cargo test -p lachesis --test phase1_slice --verbose
      - name: Divergence scan against rustc
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          BIN="$(cargo metadata --format-version=1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])'/debug/moira)"
          SLICE="lachesis/tests/phase1-slice/accept"
          echo "## Moira vs rustc divergence scan (Phase-1 slice)" >> "$GITHUB_STEP_SUMMARY"
          for f in "$SLICE"/*.rs; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            "$BIN" --diff "$f" >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Divergence summary
        if: always()
        run: echo "Divergence scan complete; see the job summary for the report."
