[package]
name = "moira"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TPT Moira: a from-scratch, high-performance Rust compiler"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/moira"
homepage = "https://github.com/tpt-solutions/moira"
documentation = "https://docs.rs/moira"
readme = "README.md"
keywords = ["compiler", "rust", "rustc", "toolchain", "fast"]
categories = ["compilers", "command-line-utilities", "development-tools"]


[workspace]
members = ["clotho", "lachesis", "atropos", "moira-alloc", "moira-bench"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/moira"

[dependencies]
clotho = { path = "clotho" }
lachesis = { path = "lachesis" }
atropos = { path = "atropos" }

[[bin]]
name = "moira"
path = "src/main.rs"
